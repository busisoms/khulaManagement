# Render blueprint: one Node web service with a persistent disk for SQLite.
# Secrets (LLM_API_KEY, DEMO_PASSCODE) are set in the Render dashboard, never here.
services:
  - type: web
    name: growth-advisor
    runtime: node
    plan: starter # persistent disks need a paid plan
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_PASSCODE
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
