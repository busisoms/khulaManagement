# Render blueprint: one free Node web service with SQLite on the instance's
# ephemeral filesystem. The free plan has no persistent disks, so the database
# is recreated (and the demo reseeded) whenever the service restarts, redeploys
# or wakes up after idling. For durable data, switch to plan: starter and add a
# disk mounted at /data with DATABASE_URL=file:/data/app.db.
# Secrets (LLM_API_KEY, DEMO_PASSCODE) are set in the Render dashboard, never here.
services:
  - type: web
    name: growth-advisor
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:./app.db # relative to prisma/schema.prisma
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_PASSCODE
        sync: false
